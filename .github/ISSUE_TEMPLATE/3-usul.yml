name: 💡 Usul fitur / channel
description: Punya ide fitur baru atau link channel gratis yang belum ada
title: "[Usul] "
labels: ["enhancement"]
body:
  - type: textarea
    id: usul
    attributes:
      label: Usulnya apa?
      placeholder: Contoh — tambah kategori Olahraga terpisah dari Berita.
    validations:
      required: true
  - type: textarea
    id: alasan
    attributes:
      label: Kenapa berguna?
  - type: input
    id: link
    attributes:
      label: Link channel (kalau mengusulkan channel)
      description: Hanya link siaran gratis yang resmi/publik.
