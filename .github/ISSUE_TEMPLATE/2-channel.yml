name: 📺 Broken / wrong channel
description: A channel won't play, shows something else, or has a wrong logo or programme guide
title: "[Channel] "
labels: ["channel"]
body:
  - type: markdown
    attributes:
      value: |
        First try **Settings → Scan channel signals** in TV ZT. iptv-org links are sometimes down for a while and come back on their own.
  - type: input
    id: channel
    attributes:
      label: Channel name & number
      placeholder: e.g. Indonesia · 8 Trans7
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Problem
      options:
        - Won't play / error
        - Plays but stutters
        - Content doesn't match the channel name
        - Wrong or missing logo
        - Wrong programme guide
        - Other
    validations:
      required: true
  - type: input
    id: error
    attributes:
      label: Error message on screen (if any)
      placeholder: e.g. manifestLoadError · HTTP 403
  - type: input
    id: network
    attributes:
      label: Internet connection
      placeholder: e.g. IndiHome 30 Mbps, Wi-Fi
