name: 🐞 Lapor masalah
description: Aplikasi error, tidak bisa dipasang, macet, tampilan aneh, tombol remote tidak jalan
title: "[Masalah] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih sudah melapor! Isi sejelas mungkin supaya mudah diperbaiki.
        **Jangan** tulis data pribadi (sandi, nomor HP, alamat) di sini — laporan ini bisa dilihat semua orang.
  - type: textarea
    id: masalah
    attributes:
      label: Apa masalahnya?
      description: Ceritakan singkat apa yang terjadi.
      placeholder: Contoh — setelah buka kategori Musik, layar hitam lalu aplikasi menutup sendiri.
    validations:
      required: true
  - type: textarea
    id: langkah
    attributes:
      label: Langkah sampai masalah muncul
      placeholder: |
        1. Buka TV ZT
        2. Pilih kartu Musik
        3. Tekan OK di video
    validations:
      required: true
  - type: input
    id: perangkat
    attributes:
      label: Perangkat
      description: Merek/tipe TV atau STB dan versi Android (Setelan → Tentang).
      placeholder: Contoh — ZTE B860H V5, Android 10
    validations:
      required: true
  - type: input
    id: versi
    attributes:
      label: Versi TV ZT
      placeholder: Contoh — v1.0
    validations:
      required: true
  - type: textarea
    id: foto
    attributes:
      label: Foto layar (opsional)
      description: Tarik & lepas foto/video layar TV ke kotak ini.
